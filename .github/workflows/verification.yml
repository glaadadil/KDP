name: Vérifier Venture Publisher
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'venture/web/**'
      - 'examples/**'
      - '.github/workflows/verification.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install chromium
      - run: python -m unittest discover -v
      - run: python tests/desktop.py
